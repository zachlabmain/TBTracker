<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Taco Compass</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #1f2833;
      --accent: #702283;
      --neon: #c000ff;
      --text: #ffffff;
      --muted: #a0aab2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      overflow: hidden;
    }
    header { text-align: center; margin-top: 10px; }
    h1 { font-size: 1.5rem; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
    #compass-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compass-dial {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(192, 0, 255, 0.3);
      box-shadow: 0 0 25px rgba(112, 34, 131, 0.4);
    }
    #needle {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: transform 0.12s cubic-bezier(0.1, 0.9, 0.2, 1);
      transform: rotate(0deg);
    }
    .needle-pointer {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 50px solid var(--neon);
      filter: drop-shadow(0 0 8px var(--neon));
      margin-top: 10px;
    }
    #info-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #distance { font-size: 2.2rem; font-weight: 800; color: #fff; }
    #store-name { font-size: 1.1rem; color: var(--muted); margin-top: 4px; }
    .btn {
      background: linear-gradient(135deg, #702283, #9b1eb8);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 30px;
      width: 100%;
      max-width: 400px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(112, 34, 131, 0.5);
    }
    .btn:active { transform: scale(0.98); }
    #maps-link { display: none; margin-top: 10px; color: #66fcf1; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>🌮 Taco Bell Radar</h1>
  </header>

  <div id="compass-container">
    <div class="compass-dial"></div>
    <div id="needle">
      <div class="needle-pointer"></div>
    </div>
  </div>

  <div id="info-card">
    <div id="distance">-- mi</div>
    <div id="store-name">Tap start below to acquire GPS</div>
    <a id="maps-link" target="_blank" rel="noopener">Open in Apple / Google Maps</a>
  </div>

  <button class="btn" id="start-btn">Start Radar</button>

  <script>
    // Replace with your Mapbox Public Token
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiemFjaGdsaWVicyIsImEiOiJjbXVrODI4MzkwM2s2MnduNGRpZWgzcGloIn0.-rgfqapmwN9HGWEEpRqJoA';

    let userCoords = null;
    let targetCoords = null;
    let compassHeading = 0;
    let targetBearing = 0;
    let watchId = null;

    const startBtn = document.getElementById('start-btn');
    const needle = document.getElementById('needle');
    const distEl = document.getElementById('distance');
    const nameEl = document.getElementById('store-name');
    const mapsLink = document.getElementById('maps-link');

    // Haversine formula to compute great-circle distance
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 3958.8; // Radius in miles
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Initial bearing between two GPS points
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    async function findNearestTacoBell(lat, lon) {
      nameEl.innerText = 'Searching nearby stores...';
      const query = encodeURIComponent('Taco Bell');
      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${query}.json?proximity=${lon},${lat}&limit=1&access_token=${MAPBOX_TOKEN}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.features || data.features.length === 0) {
          nameEl.innerText = 'No Taco Bell found within range.';
          return;
        }

        const feature = data.features[0];
        targetCoords = { lat: feature.center[1], lon: feature.center[0] };
        nameEl.innerText = feature.place_name.split(',')[0];

        mapsLink.href = `https://maps.apple.com/?daddr=${targetCoords.lat},${targetCoords.lon}`;
        mapsLink.style.display = 'inline-block';

        updateMetrics();
      } catch (err) {
        nameEl.innerText = 'Failed to load location from Mapbox.';
      }
    }

    function updateMetrics() {
      if (!userCoords || !targetCoords) return;
      const dist = calculateDistance(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
      distEl.innerText = dist < 0.1 ? `${Math.round(dist * 5280)} ft` : `${dist.toFixed(2)} mi`;
      targetBearing = calculateBearing(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon);
      updateNeedle();
    }

    function updateNeedle() {
      // Rotation angle is the target's bearing relative to the heading of the phone
      const rotation = (targetBearing - compassHeading + 360) % 360;
      needle.style.transform = `rotate(${rotation}deg)`;
    }

    // Handles iOS DeviceOrientation permission
    async function startCompass() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const response = await DeviceOrientationEvent.requestPermission();
        if (response !== 'granted') {
          alert('Compass orientation permission is required to point the needle.');
          return;
        }
      }

      window.addEventListener('deviceorientation', (e) => {
        if (e.webkitCompassHeading !== undefined) {
          // iOS Safari provides true compass heading directly
          compassHeading = e.webkitCompassHeading;
        } else if (e.alpha !== null) {
          // Non-iOS fallback
          compassHeading = 360 - e.alpha;
        }
        updateNeedle();
      }, true);
    }

    function startGPS() {
      if (!('geolocation' in navigator)) {
        alert('Geolocation is not supported by your browser.');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const firstFix = !userCoords;
          userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          if (firstFix) {
            findNearestTacoBell(userCoords.lat, userCoords.lon);
          } else {
            updateMetrics();
          }
        },
        (err) => {
          nameEl.innerText = `GPS Error: ${err.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      await startCompass();
      startGPS();
    });
  </script>
</body>
</html>
